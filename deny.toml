[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

# Each of these is either advisory-flagged or superseded. Banning them outright stops one
# arriving transitively and going unnoticed.
deny = [
    { name = "atty", reason = "unmaintained, advisory-flagged; use std::io::IsTerminal" },
    { name = "is-terminal", reason = "superseded by std::io::IsTerminal since Rust 1.70" },
    { name = "structopt", reason = "RUSTSEC-2022-0104 unmaintained; use clap 4 derive" },
    { name = "ansi_term", reason = "unmaintained; use anstyle" },
    { name = "term_size", reason = "unmaintained; use terminal_size" },
    { name = "serde_yaml", reason = "deprecated and archived by its author" },
    { name = "fuzzy-matcher", reason = "unmaintained since 2020; matching is hand-rolled" },
    { name = "termsize", reason = "stale pre-0.2; use terminal_size" },
    # We deliberately shell out to git instead: libgit2 ignores url.*.insteadOf and
    # includeIf, which silently breaks remote-to-host matching for anyone with a rewrite rule.
    { name = "git2", reason = "ignores insteadOf/includeIf; we shell out to git on purpose" },
    { name = "comfy-table", reason = "one hand-written Table is shared with tablerender" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
