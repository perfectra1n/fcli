[package]
name = "forgejo-core"
version = "0.1.0"
description = "Runtime for Forgejo API clients: HTTP transport, auth, pagination, and errors"
keywords = ["forgejo", "gitea", "api", "client"]
categories = ["api-bindings"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# This crate deliberately does NOT depend on forgejo-model. The Forgejo error body is a
# small hand-written struct here, so the two largest units in the workspace (this crate
# and the generated models) compile in parallel.

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
toml.workspace = true
bytes.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
http.workspace = true
jiff.workspace = true
secrecy.workspace = true
zeroize.workspace = true
keyring.workspace = true
etcetera.workspace = true
thiserror.workspace = true
anstyle.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
